[tool.ruff]
target-version = "py310"
line-length = 100
extend-include = [".github/scripts/kernel_build/*.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Tests bootstrap the workflow's standalone scripts before importing them.
"tests/*.py" = ["E402"]
