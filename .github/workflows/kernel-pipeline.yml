name: Kernel build pipeline

on:
  workflow_call:
    inputs:
      request_json:
        description: Dispatch fields from either entry form
        type: string
        required: true
    secrets:
      GH_PAT:
        required: false
      GH_RELEASE_TOKEN:
        required: false
      TELEGRAM_BOT_TOKEN:
        required: false
      TELEGRAM_CHANNEL_ID:
        required: false
      TELEGRAM_CHAT_ID:
        required: false

permissions:
  contents: read

# Concurrent dispatches do not cancel active builds.
concurrency:
  group: kernel-build-${{ github.workflow }}-${{ github.ref }}-${{ github.run_id }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  PYTHONUNBUFFERED: '1'
  GIT_TERMINAL_PROMPT: '0'
  TZ: Asia/Dhaka

jobs:
  prepare:
    name: 📋 Prepare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      delivery: ${{ steps.matrix.outputs.delivery }}
      settings: ${{ steps.matrix.outputs.settings }}
      matrix: ${{ steps.matrix.outputs.matrix }}
      history_depth: ${{ steps.matrix.outputs.history_depth }}
      release_repository: ${{ steps.release.outputs.release_repository }}
      release_target_sha: ${{ steps.release.outputs.release_target_sha }}
      release_skip: ${{ steps.release.outputs.release_skip }}
      release_lock: ${{ steps.release.outputs.release_lock }}
      kernel_slug: ${{ steps.matrix.outputs.kernel_slug }}
      device_slug: ${{ steps.matrix.outputs.device_slug }}
      toolchain_url: ${{ steps.toolchain.outputs.url }}
      toolchain_hash: ${{ steps.toolchain.outputs.hash }}
      toolchain_bin: ${{ steps.toolchain.outputs.bin }}
      apt_epoch: ${{ steps.toolchain.outputs.apt_epoch }}
    steps:
      # actions/checkout v7.0.1
      - name: 📂 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: 🔎 Validate inputs
        id: matrix
        env:
          INPUTS_JSON: ${{ inputs.request_json }}
          GH_PAT: ${{ secrets.GH_PAT }}
          GH_RELEASE_TOKEN: ${{ secrets.GH_RELEASE_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 .github/scripts/kernel_build/prepare.py matrix
      - name: 🔐 Check release
        id: release
        if: fromJSON(steps.matrix.outputs.delivery).github
        env:
          INPUTS_JSON: ${{ steps.matrix.outputs.settings }}
          GH_TOKEN: ${{ secrets.GH_RELEASE_TOKEN || secrets.GH_PAT }}
        run: python3 .github/scripts/kernel_build/publication.py preflight
      - name: 🔖 Pin compiler
        id: toolchain
        env:
          TOOLCHAIN: ${{ fromJSON(steps.matrix.outputs.settings).toolchain }}
        run: python3 .github/scripts/kernel_build/prepare.py toolchain

  build:
    name: Build ${{ matrix.branch }} · ${{ matrix.image_type }}
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    env:
      KERNEL_NAME: ${{ fromJSON(needs.prepare.outputs.settings).kernel_name }}
      KERNEL_RC: ${{ fromJSON(needs.prepare.outputs.settings).kernel_rc }}
      DEVICE_NAME: ${{ fromJSON(needs.prepare.outputs.settings).device_name }}
      DEVICE_CODENAMES: ${{ fromJSON(needs.prepare.outputs.settings).device_codenames }}
      SUPPORTED_VERSIONS: ${{ fromJSON(needs.prepare.outputs.settings).supported_versions }}
      TOOLCHAIN: ${{ fromJSON(needs.prepare.outputs.settings).toolchain }}
      BUILD_ACTOR: ${{ github.triggering_actor || github.actor }}
      ANYKERNEL_REPOSITORY: ${{ fromJSON(needs.prepare.outputs.settings).anykernel_repository }}
      MATRIX_ID: ${{ matrix.id }}
      HISTORY_DEPTH: ${{ needs.prepare.outputs.history_depth }}
      CHANGELOG_MODE: ${{ fromJSON(needs.prepare.outputs.settings).changelog_mode }}
      COMMIT_COUNT: ${{ fromJSON(needs.prepare.outputs.settings).commit_count }}
      BRANCH: ${{ matrix.branch }}
      DEFCONFIG: ${{ matrix.defconfig }}
      IMAGE_TYPE: ${{ matrix.image_type }}
      BUILD_MODE: ${{ fromJSON(needs.prepare.outputs.settings).build_mode }}
      REPO_VISIBILITY: ${{ fromJSON(needs.prepare.outputs.settings).repo_visibility }}
      KERNEL_REPOSITORY: ${{ fromJSON(needs.prepare.outputs.settings).kernel_repository }}
      TOOLCHAIN_URL: ${{ needs.prepare.outputs.toolchain_url }}
      TOOLCHAIN_HASH: ${{ needs.prepare.outputs.toolchain_hash }}
      TOOLCHAIN_BIN_REL: ${{ needs.prepare.outputs.toolchain_bin }}
      TOOLCHAIN_DIR: ${{ github.workspace }}/.toolchains/${{ needs.prepare.outputs.toolchain_hash }}
      APT_CACHE_DIR: ${{ github.workspace }}/.kernel-build-apt
      CCACHE_DIR: /home/runner/.cache/ccache
      CCACHE_BASEDIR: ${{ github.workspace }}/kernel
      CCACHE_COMPILERCHECK: content
      CCACHE_NOHASHDIR: 'true'
      CCACHE_COMPRESS: 'true'
      CCACHE_MAXSIZE: 2G
    steps:
      - name: 📂 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: 🖥️ Identify host
        id: host
        run: python3 .github/scripts/kernel_build/prepare.py runner
      - name: 🧹 Free disk
        run: |
          df -h "$GITHUB_WORKSPACE"
          sudo rm -rf -- /usr/local/lib/android /usr/share/dotnet /opt/ghc
          df -h "$GITHUB_WORKSPACE"
      - name: 📥 Restore APT
        id: apt-cache
        # actions/cache v6.1.0
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ env.APT_CACHE_DIR }}
          key: kernel-build-apt-v2-${{ steps.host.outputs.cache_namespace }}-${{ hashFiles('.github/scripts/kernel_build/packages.txt') }}-${{ needs.prepare.outputs.apt_epoch }}
          restore-keys: |
            kernel-build-apt-v2-${{ steps.host.outputs.cache_namespace }}-${{ hashFiles('.github/scripts/kernel_build/packages.txt') }}-
      - name: 📦 Dependencies
        id: dependencies
        run: bash .github/scripts/kernel_build/dependencies.sh
      - name: 💾 Save APT
        if: steps.apt-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ env.APT_CACHE_DIR }}
          key: ${{ steps.apt-cache.outputs.cache-primary-key }}
      - name: 📥 Restore compiler
        id: toolchain-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ env.TOOLCHAIN_DIR }}
          key: kernel-build-toolchain-v3-${{ steps.host.outputs.cache_namespace }}-${{ needs.prepare.outputs.toolchain_hash }}
      - name: 🛠️ Check compiler
        id: compiler
        run: bash .github/scripts/kernel_build/toolchain.sh
      - name: 💾 Save compiler
        if: steps.toolchain-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ env.TOOLCHAIN_DIR }}
          key: ${{ steps.toolchain-cache.outputs.cache-primary-key }}
      - name: 📥 Restore objects
        id: ccache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ env.CCACHE_DIR }}
          key: kernel-build-ccache-v2-${{ steps.host.outputs.cache_namespace }}-${{ needs.prepare.outputs.toolchain_hash }}-${{ matrix.id }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            kernel-build-ccache-v2-${{ steps.host.outputs.cache_namespace }}-${{ needs.prepare.outputs.toolchain_hash }}-${{ matrix.id }}-
            kernel-build-ccache-v2-${{ steps.host.outputs.cache_namespace }}-${{ needs.prepare.outputs.toolchain_hash }}-
      - name: 🌿 Fetch source
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: bash .github/scripts/kernel_build/clone.sh
      - name: ⚙️ Compile
        id: compile
        run: bash .github/scripts/kernel_build/build.sh
      - name: 📦 Package ZIP
        id: package
        run: /usr/bin/python3 .github/scripts/kernel_build/package.py
      - name: 📤 Raw artifacts
        id: payload-artifact
        # Raw payloads only; flashable ZIPs use the selected publication destinations.
        # actions/upload-artifact v7.0.2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          archive: true
          name: ${{ needs.prepare.outputs.kernel_slug }}-${{ needs.prepare.outputs.device_slug }}-${{ matrix.id }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/Image.gz.dtb
            artifacts/Image.gz
            artifacts/Image.lz4
            artifacts/dtbo.img
            artifacts/dtb.img
            artifacts/cust-atoll*.dtb
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: 🧾 Release manifest
        if: fromJSON(needs.prepare.outputs.delivery).bundles
        run: python3 .github/scripts/kernel_build/publication.py bundle
      - name: 📤 Release bundle
        id: publisher-bundle
        if: fromJSON(needs.prepare.outputs.delivery).bundles
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          archive: true
          name: release-bundle-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.id }}
          # Raw images already have their own artifact; publishers need only ZIPs.
          path: |
            artifacts/**/*.zip
            logs/release-manifest.json
            logs/clang-version.txt
            logs/lld-version.txt
            logs/commit-message.txt
            logs/recent-commits.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - name: 📋 Upload logs
        id: diagnostics-artifact
        if: always() && steps.compile.outcome != 'skipped'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          archive: true
          name: ${{ needs.prepare.outputs.kernel_slug }}-${{ needs.prepare.outputs.device_slug }}-logs-${{ matrix.id }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: logs/
          if-no-files-found: ignore
          retention-days: 7
      - name: 📊 Cache stats
        if: always() && steps.dependencies.outcome == 'success'
        run: ccache --show-stats
      - name: 💾 Save objects
        if: always() && !cancelled() && steps.ccache.outcome == 'success' && steps.compile.outcome != 'skipped'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ steps.ccache.outputs.cache-primary-key }}

  publish_release:
    name: 🚀 Release
    needs: [prepare, build]
    # Verify the complete build set even when diagnostics or cache steps fail.
    if: >-
      always() && !cancelled() && needs.prepare.result == 'success' &&
      fromJSON(needs.prepare.outputs.delivery).github &&
      needs.prepare.outputs.release_skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: kernel-release-${{ needs.prepare.outputs.release_lock }}
      cancel-in-progress: false
    steps:
      - name: 📂 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # actions/download-artifact v8.0.2
      # One matching artifact extracts flat; multiple matches get name folders.
      # The shared loader validates both layouts without merging build contents.
      - name: 📥 Release bundles
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: release-bundle-${{ github.run_id }}-${{ github.run_attempt }}-*
          path: release-downloads
          merge-multiple: false
          skip-decompress: false
          digest-mismatch: error
      - name: 🚀 Publish release
        env:
          GH_TOKEN: ${{ secrets.GH_RELEASE_TOKEN || secrets.GH_PAT }}
          INPUTS_JSON: ${{ needs.prepare.outputs.settings }}
          MATRIX_JSON: ${{ needs.prepare.outputs.matrix }}
          RELEASE_TARGET_SHA: ${{ needs.prepare.outputs.release_target_sha }}
        run: python3 .github/scripts/kernel_build/publication.py publish

  telegram_release:
    name: 📣 Telegram channel release
    needs: [prepare, build]
    if: >-
      always() && !cancelled() &&
      needs.prepare.result == 'success' && needs.build.result == 'success' &&
      fromJSON(needs.prepare.outputs.delivery).channel
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: telegram-channel-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - name: 📂 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: 📥 Release bundles
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: release-bundle-${{ github.run_id }}-${{ github.run_attempt }}-*
          path: release-downloads
          merge-multiple: false
          skip-decompress: false
          digest-mismatch: error
      - name: 📣 Publish channel
        env:
          TELEGRAM_CHANNEL_CONFIRMED: 'true'
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          INPUTS_JSON: ${{ needs.prepare.outputs.settings }}
          MATRIX_JSON: ${{ needs.prepare.outputs.matrix }}
        run: python3 .github/scripts/kernel_build/telegram_release.py

  telegram_delivery:
    name: ✉️ Personal Telegram ZIP
    needs: [prepare, build]
    if: >-
      always() && !cancelled() &&
      needs.prepare.result == 'success' && needs.build.result == 'success' &&
      fromJSON(needs.prepare.outputs.delivery).personal
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: telegram-personal-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - name: 📂 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: 📥 Release bundles
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: release-bundle-${{ github.run_id }}-${{ github.run_attempt }}-*
          path: release-downloads
          merge-multiple: false
          skip-decompress: false
          digest-mismatch: error
      - name: ✉️ Send personal ZIP
        env:
          TELEGRAM_DELIVERY_CONFIRMED: 'true'
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          INPUTS_JSON: ${{ needs.prepare.outputs.settings }}
          MATRIX_JSON: ${{ needs.prepare.outputs.matrix }}
        run: python3 .github/scripts/kernel_build/telegram_delivery.py
